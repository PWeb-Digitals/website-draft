[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 301 www to apex host and force https
[[redirects]]
  from = "https://www.pwebdigitals.com/*"
  to = "https://pwebdigitals.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pwebdigitals.com/*"
  to = "https://pwebdigitals.com/:splat"
  status = 301
  force = true

